---
remote_theme: just-the-docs/just-the-docs

drjekyll:
  version: 1.0.0
  github: "https://github.com/camalot/drjekyll-action"
  docs: "https://camalot.github.io/drjekyll-action/"

mermaid:
  version: "11.15.0"

url: "{{ input.url }}"
baseurl: "{{ input.baseurl }}"
logo: /assets/images/logo.png
logo_svg: /assets/images/logo.svg
favicon: /assets/images/favicon.ico

# Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - rouge
  - jekyll-gfm-admonitions

highlighter: rouge
destination: "{{ input.output_dir }}"

# kramdown:
#   input: GFM
#   syntax_highlighter: rouge

# Theme configuration

search_enabled: true
search:
  heading_level: 2
  previews: 3

nav_sort: case_insensitive

color_scheme: dracula

# Aux links (top nav)
aux_links: {}
  # "Title 1":
  #   - "https://example.com/link1"
  # "Title 2":
  #   - "https://example.com/link2"
  # "Title 3":
  #   - "https://example.com/link3"

aux_links_new_tab: true
math: katex

# Back to top link — replaced by custom FAB button (see _includes/footer_custom.html)
back_to_top: false

# Suppress Sass deprecation warnings from just-the-docs theme (darken/lighten, @import, etc.)
sass:
  silence_deprecations:
    - color-functions
    - import
    - global-builtin

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  tip:
    title: Tip
    color: blue
  warning:
    title: Warning
    color: yellow
  caution:
    title: Caution
    color: red

# Regenerate configuration
# Force full rebuild when custom plugins change to ensure lexer is properly reloaded
regenerate:
  - _plugins

# Exclude from build
exclude:
  - _plans/
  - Gemfile
  - Gemfile.lock
  - node_modules/
